[platformio]
default_envs = coach_hub

[env]
platform = espressif32
framework = arduino
board = esp32doit-devkit1
monitor_speed = 115200
monitor_filters = time, colorize
upload_speed = 921600
build_flags = -std=gnu++17

; ===========================================================================
; SpeedX athlete-tracking mesh
; ---------------------------------------------------------------------------
;   coach_hub   -> central USB ESP-NOW adapter / dashboard sink
;   athleteN    -> body-worn wearable, one env per athlete (unique node id)
; Each athlete wearable needs a UNIQUE ATHLETE_NODE_ID. Duplicate an athlete
; env block and bump the id to add more runners. Set the matching
; upload_port / monitor_port for each board on your machine.
; ===========================================================================

[env:coach_hub]
build_src_filter = +<coach_hub/>
build_flags = ${env.build_flags} -DCOACH_TEAM_ID=1
monitor_port = /dev/cu.SLAB_USBtoUART
upload_port = /dev/cu.SLAB_USBtoUART

[env:athlete1]
build_src_filter = +<athlete_wearable/>
build_flags = ${env.build_flags} -DATHLETE_NODE_ID=11 -DATHLETE_TEAM_ID=1
monitor_port = /dev/cu.SLAB_USBtoUART1
upload_port = /dev/cu.SLAB_USBtoUART1

[env:athlete2]
build_src_filter = +<athlete_wearable/>
build_flags = ${env.build_flags} -DATHLETE_NODE_ID=12 -DATHLETE_TEAM_ID=1
monitor_port = /dev/cu.SLAB_USBtoUART2
upload_port = /dev/cu.SLAB_USBtoUART2

[env:athlete3]
build_src_filter = +<athlete_wearable/>
build_flags = ${env.build_flags} -DATHLETE_NODE_ID=13 -DATHLETE_TEAM_ID=1
monitor_port = /dev/cu.SLAB_USBtoUART3
upload_port = /dev/cu.SLAB_USBtoUART3

; ===========================================================================
; Generic ESP-NOW demo nodes (kept from the original framework, optional).
; ===========================================================================

[env:esp32_node1]
build_src_filter = +<node_sender/>
monitor_port = /dev/cu.SLAB_USBtoUART
upload_port = /dev/cu.SLAB_USBtoUART

[env:esp32_node2]
build_src_filter = +<node_receiver/>
monitor_port = /dev/cu.SLAB_USBtoUART2
upload_port = /dev/cu.SLAB_USBtoUART2

[env:esp32_mesh]
build_src_filter = +<node_mesh/>
monitor_port = /dev/cu.SLAB_USBtoUART3
upload_port = /dev/cu.SLAB_USBtoUART3
