[platformio]
default_envs = esp32_node1

[env]
platform = espressif32
framework = arduino
board = esp32doit-devkit1
monitor_speed = 115200
upload_speed = 921600
lib_deps = 
    ESP32 core
build_flags = -std=gnu++17

[env:esp32_node1]
build_src_filter = +<*> -<../src/node_receiver> -<../src/node_mesh>
monitor_port = /dev/cu.SLAB_USBtoUART
upload_port = /dev/cu.SLAB_USBtoUART

[env:esp32_node2]
build_src_filter = +<*> -<../src/node_sender> -<../src/node_mesh>
monitor_port = /dev/cu.SLAB_USBtoUART2
upload_port = /dev/cu.SLAB_USBtoUART2

[env:esp32_mesh]
build_src_filter = +<*> -<../src/node_sender> -<../src/node_receiver>
monitor_port = /dev/cu.SLAB_USBtoUART3
upload_port = /dev/cu.SLAB_USBtoUART3
