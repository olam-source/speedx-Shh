[platformio]
default_envs = coach_hub

[env]
platform = espressif32
framework = arduino
board = esp32doit-devkit-v1
monitor_speed = 115200
monitor_filters = time, colorize
upload_speed = 921600
; Frames are AES-256-GCM encrypted by default. Set your OWN team passphrase here
; (every node in the mesh must share it). Disable with -DESPNOW_ENCRYPT=0.
build_flags =
    -std=gnu++17
    '-DESPNOW_PSK_PASSPHRASE="speedx-change-this-passphrase"'

; coach_hub -> USB dashboard sink.  athlete1 -> wearable (one binary for the
; whole team; assign each board's id over USB with `id <n>`). athlete1_hw adds
; the real sensors. Set the matching upload_port/monitor_port for your machine.

[env:coach_hub]
build_src_filter = +<coach_hub/>
build_flags = ${env.build_flags} -DCOACH_TEAM_ID=1
monitor_port = /dev/cu.SLAB_USBtoUART
upload_port = /dev/cu.SLAB_USBtoUART

; Simulated sensors + BLE HR broadcast. Good for testing BLE peripheral
; advertising on a bare ESP32 before full hardware is assembled.
[env:athlete1]
build_src_filter = +<athlete_wearable/>
build_flags =
    ${env.build_flags}
    -DATHLETE_NODE_ID=11
    -DATHLETE_TEAM_ID=1
    -DUSE_BLE_HR
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.2
monitor_port = /dev/cu.SLAB_USBtoUART1
upload_port = /dev/cu.SLAB_USBtoUART1

; Real-hardware wearable: MAX30003 ECG + MPU-6050 + NEO-M8N + BLE peripheral.
; SpeedX IS the chest strap — broadcasts HR directly to Garmin/Coros/Apple Watch.
; Override pins with e.g. -DPIN_GPS_RX=27 (see include/athlete_sensors.h).
; ponytail: PIN_ECG_FCLK uses LEDC ~32768 Hz; swap for ext oscillator if BPM drifts.
[env:athlete1_hw]
build_src_filter = +<athlete_wearable/>
build_flags =
    ${env.build_flags}
    -DATHLETE_NODE_ID=11
    -DATHLETE_TEAM_ID=1
    -DUSE_REAL_SENSORS
    -DUSE_BLE_HR
    -DPIN_ECG_CS=5
    -DPIN_ECG_INT=34
    -DPIN_ECG_FCLK=26
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.2
    mikalhart/TinyGPSPlus @ ^1.0.3
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit BusIO @ ^1.16.1
monitor_port = /dev/cu.SLAB_USBtoUART1
upload_port = /dev/cu.SLAB_USBtoUART1
